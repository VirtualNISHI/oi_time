name: Post BTC OI chart

on:
  schedule:
    # GitHub Actions cron is UTC. JST = UTC + 9h
    # 00:10 / 08:10 / 16:10 UTC  =  09:10 / 17:10 / 01:10 JST
    # → JSTの 9時前後を基準に8時間毎 (1日3回) Discord + X 両方へ投稿。
    # 9:00 ジャストはGHA cron 遅延でmissが多いため +10min ずらしている。
    # X API Free枠: 17 tweets/24h, 500/month — 3/day なので余裕
    - cron: "10 0,8,16 * * *"
  workflow_dispatch:
    inputs:
      enable_x:
        description: "Enable X (Twitter) posting for THIS run only"
        type: boolean
        default: false
      force:
        description: "Force post even if same chart was already posted"
        type: boolean
        default: false
      dry_run:
        description: "Generate chart but skip both Discord and X posting"
        type: boolean
        default: false
      skip_discord:
        description: "Skip Discord (use to send only to X)"
        type: boolean
        default: false
      commentary_providers:
        description: "Override commentary provider order (comma-separated, e.g. openai,gemini). Empty = use default chain."
        type: string
        default: ""

permissions:
  contents: write    # needed for _ci_state.sh to push to bot-state branch

concurrency:
  group: oi-time-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          rm -rf ~/.cache/matplotlib

      - name: Restore state from bot-state branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh restore

      - name: Generate + post chart
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          COMMENTARY_PROVIDERS: ${{ inputs.commentary_providers }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          IMAGES_DIR: ./images
          # Trial: 30-day window. 14d still left the lower corners empty
          # (BTC hadn't visited $70k area in 2 weeks). 30d reaches further
          # back to capture wider price history.
          # Kline interval is auto-picked (60min for ≥7d).
          # Drop back to "24" to return to last-24h view.
          CHART_LOOKBACK_HOURS: "720"
          CHART_RANGE_PCT: "3"
          # Trial: symmetric ±7% window (both _UP and _DOWN set explicitly,
          # which also disables auto-fit so the wider view is actually shown).
          # Drop both _UP and _DOWN to return to the default 3% auto-fitted view.
          CHART_RANGE_PCT_UP: "7"
          CHART_RANGE_PCT_DOWN: "7"
          POST_TEMPLATE: "【BTC価格帯別OIマップ】 Mark {mark}\n\nVol  買 {vol_buy} / 売 {vol_sell} BTC\nLiq  S {liq_short} / L {liq_long} BTC\nOI   {oi} BTC ({oi_chg})\n\n{commentary}\n\n{timestamp} JST  #BTC #Bitcoin\n※OIはAIが収集したもので推定となります"
          # X gating:
          # During the +10% range trial (2026-05-20–) scheduled runs are
          # Discord-only. Manual runs can still opt-in to X via inputs.enable_x.
          # To re-enable X for cron, change the schedule branch back to 'true'.
          ENABLE_X: ${{ github.event_name == 'schedule' && 'false' || (inputs.enable_x && 'true' || 'false') }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.skip_discord }}" = "true" ]; then ARGS="$ARGS --skip-discord"; fi
          python post_chart.py $ARGS

      - name: Save state to bot-state branch
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh save

      - name: Upload chart as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc_profile_${{ github.run_id }}
          path: images/btc_profile.png
          if-no-files-found: ignore
          retention-days: 14
