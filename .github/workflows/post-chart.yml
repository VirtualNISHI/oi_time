name: Post BTC OI chart

on:
  schedule:
    # GitHub Actions cron is UTC. JST = UTC + 9h
    # 00:10 / 06:10 / 12:10 / 18:10 UTC = 09:10 / 15:10 / 21:10 / 03:10 JST
    # → 6時間毎 (1日4回) Discord + X 両方へ投稿。
    # 上記時刻はトップオブアワー回避のため +10min。
    # X API Free枠: 17 tweets/24h, 500/month — 4/day, 120/month で余裕。
    - cron: "10 0,6,12,18 * * *"

    # --- FOMC dense windows (X only) ---------------------------------------
    # 政策金利発表 (2:00 PM ET) 前後を密に増量投稿 (発表 -30min 〜 +130min の間で
    # 実質30分毎、計6投稿/回)。発表は EDT 期=18:00 UTC / EST 期(1月・12月)=19:00 UTC。
    #
    # 2026-06-17 の実運用で判明した問題と対策:
    #   1) cron を毎時 :00/:30 に置くと GitHub Actions 側の混雑 (GH公式ドキュメント
    #      が「毎時0分・30分は最も遅延しやすい」と明記) で数十分〜1時間超の発火遅延
    #      が発生した。→ :05/:35 にずらして混雑時間帯を回避。
    #   2) tweepy.Client (X API v2) がタイムアウト未設定で無期限ハングし、1件の
    #      投稿がジョブの timeout-minutes 一杯まで張り付いた。concurrency グループ
    #      が直列実行のため、後続の全トリガーがその分後ろ倒しになった。
    #      → post_chart.py 側で明示的な timeout を設定済み (post_to_x)。
    #   3) 常に窓の外側になる時間帯 (旧: hour 21 全体) を削り、無駄な発火を削減。
    # 発火時刻 (:05,:35 を hour 17-20 or 18-21 に展開) は実際の投稿可否判定に使わず、
    # fomc_schedule.py の連続的な窓判定 (--require-fomc-window) に委ねる。
    # → 窓外の発火は post_chart.py が即 return 0 で no-op。
    # 投稿先は X のみ (このジョブで --skip-discord を付与)。
    # FOMC 日の X は base4 + dense6 = 約10/日 → 無料枠17/日に収まる。
    #
    # ⚠ 毎年更新: Fed が翌年のカレンダーを公表したら下記日付と
    #   fomc_schedule.py の FOMC_ANNOUNCEMENTS_UTC を差し替えること。
    #   2026: Jan28(EST) / Mar18(EDT) / Apr29(EDT) / Jun17(EDT) / Jul29(EDT) /
    #         Sep16(EDT) / Oct28(EDT) / Dec9(EST)
    #   (万一 月日が翌年も一致して発火しても、年が違えば窓判定で弾かれる)
    - cron: "5,35 18-21 28 1 *"    # Jan 28, 2026 (EST, announce 19:00 UTC)
    - cron: "5,35 17-20 18 3 *"    # Mar 18, 2026 (EDT, announce 18:00 UTC)
    - cron: "5,35 17-20 29 4 *"    # Apr 29, 2026 (EDT)
    - cron: "5,35 17-20 17 6 *"    # Jun 17, 2026 (EDT)
    - cron: "5,35 17-20 29 7 *"    # Jul 29, 2026 (EDT)
    - cron: "5,35 17-20 16 9 *"    # Sep 16, 2026 (EDT)
    - cron: "5,35 17-20 28 10 *"   # Oct 28, 2026 (EDT)
    - cron: "5,35 18-21 9 12 *"    # Dec 9, 2026 (EST, announce 19:00 UTC)
  workflow_dispatch:
    inputs:
      enable_x:
        description: "Enable X (Twitter) posting for THIS run only"
        type: boolean
        default: false
      force:
        description: "Force post even if same chart was already posted"
        type: boolean
        default: false
      dry_run:
        description: "Generate chart but skip both Discord and X posting"
        type: boolean
        default: false
      skip_discord:
        description: "Skip Discord (use to send only to X)"
        type: boolean
        default: false
      commentary_providers:
        description: "Override commentary provider order (comma-separated, e.g. openai,gemini). Empty = use default chain."
        type: string
        default: ""

permissions:
  contents: write    # needed for _ci_state.sh to push to bot-state branch

concurrency:
  group: oi-time-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # 15 -> 20: extra headroom so one slow run doesn't eat the whole budget.
    # Combined with the tweepy session timeout fix, a stuck run should now
    # fail fast well inside this instead of riding it out to the limit.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Japanese font (Noto Sans CJK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          rm -rf ~/.cache/matplotlib

      - name: Restore state from bot-state branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh restore

      - name: Generate + post chart
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          COMMENTARY_PROVIDERS: ${{ inputs.commentary_providers }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          IMAGES_DIR: ./images
          # Trial: 30-day window. 14d still left the lower corners empty
          # (BTC hadn't visited $70k area in 2 weeks). 30d reaches further
          # back to capture wider price history.
          # Kline interval is auto-picked (60min for ≥7d).
          # Drop back to "24" to return to last-24h view.
          CHART_LOOKBACK_HOURS: "720"
          CHART_RANGE_PCT: "3"
          # Trial: symmetric ±7% window (both _UP and _DOWN set explicitly,
          # which also disables auto-fit so the wider view is actually shown).
          # Drop both _UP and _DOWN to return to the default 3% auto-fitted view.
          CHART_RANGE_PCT_UP: "7"
          CHART_RANGE_PCT_DOWN: "7"
          POST_TEMPLATE: "【BTC価格帯別OIマップ】 Mark {mark}\n\nVol  買 {vol_buy} / 売 {vol_sell} BTC\nLiq  S {liq_short} / L {liq_long} BTC\nOI   {oi} BTC ({oi_chg})\n\n{commentary}\n\n{timestamp} JST  #BTC #Bitcoin\n※OIはAIが収集したもので推定となります"
          # X gating:
          # Scheduled runs post to X (user-approved 2026-05-28, 6h cadence).
          # Manual runs require inputs.enable_x to be explicitly true.
          ENABLE_X: ${{ github.event_name == 'schedule' && 'true' || (inputs.enable_x && 'true' || 'false') }}
          # FOMC dense mode: true when triggered by any schedule OTHER than the
          # base 6h cron (i.e. one of the FOMC 30-min crons). github.event.schedule
          # is the exact cron string that fired this run.
          FOMC_DENSE: ${{ github.event_name == 'schedule' && github.event.schedule != '10 0,6,12,18 * * *' && 'true' || 'false' }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.skip_discord }}" = "true" ]; then ARGS="$ARGS --skip-discord"; fi
          if [ "$FOMC_DENSE" = "true" ]; then
            # FOMC dense window → X only, gated to the actual announcement window.
            echo "FOMC dense schedule fired (${{ github.event.schedule }}) — X only, window-gated"
            ARGS="$ARGS --skip-discord --require-fomc-window"
          fi
          python post_chart.py $ARGS

      - name: Save state to bot-state branch
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/_ci_state.sh save

      - name: Upload chart as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc_profile_${{ github.run_id }}
          path: images/btc_profile.png
          if-no-files-found: ignore
          retention-days: 14
